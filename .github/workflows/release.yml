name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: "Force the tag/publish half (resume a partial release)"
        type: boolean
        default: false

jobs:
  release:
    uses: gjtorikian/actions/.github/workflows/rust_crate_release.yml@main
    # A called workflow can't exceed the caller's grant; these are what its
    # jobs declare (PR creation, tag push, GitHub release, OIDC token).
    permissions:
      contents: write
      pull-requests: write
      actions: write
      id-token: write
    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}
    with:
      prepare: true
      # Null on push events, so this is false unless dispatched with the box ticked.
      release: ${{ inputs.release == true }}
